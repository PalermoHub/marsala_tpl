name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test logica orari e integrità dati
        run: node --test scripts/test.mjs
      # Si pubblica solo l'app: niente documenti interni, contesto di lavoro o script.
      - name: Prepara i file da pubblicare
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js fonts dati img _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
